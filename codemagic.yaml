workflows:
  ios-smartattend:
    name: SmartAttend iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22.11.0
      xcode: latest
      groups:
        - apple_credentials
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.smartattend.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'testing-branch'
          include: true
          source: true
    scripts:
      - name: Install NPM dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          node scripts/patch_spm.js
      - name: Build Vite React Web App
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build iOS App with Xcode 16
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          # Discover real non-placeholder simulator destination directly from xcodebuild
          DEST_ARG=$(xcodebuild -showdestinations $TARGET_ARG -scheme "$XCODE_SCHEME" 2>/dev/null | grep -i "platform:iOS Simulator" | grep -i "iPhone" | grep -v "placeholder" | head -n 1 | sed -E 's/.*id:([^,}]+).*/id=\1/' | xargs)

          if [ -z "$DEST_ARG" ]; then
            DEST_ARG=$(xcodebuild -showdestinations $TARGET_ARG -scheme "$XCODE_SCHEME" 2>/dev/null | grep -i "platform:iOS Simulator" | grep -v "placeholder" | head -n 1 | sed -E 's/.*id:([^,}]+).*/id=\1/' | xargs)
          fi

          if [ -z "$DEST_ARG" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' | xargs)
            if [ -n "$SIM_ID" ]; then
              DEST_ARG="id=$SIM_ID"
            else
              DEST_ARG="platform=iOS Simulator,name=iPhone 16"
            fi
          fi

          echo "Using Real Simulator Destination: $DEST_ARG"

          xcodebuild build \
            $TARGET_ARG \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "$DEST_ARG" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphonesimulator/App.app Payload/SmartAttend.app
          zip -r SmartAttend.ipa Payload
          zip -r SmartAttend-Simulator.zip build/Build/Products/Release-iphonesimulator/App.app
    artifacts:
      - SmartAttend.ipa
      - SmartAttend-Simulator.zip
    publishing:
      email:
        recipients:
          - onteddukalyani@gmail.com
        notify:
          success: true
          failure: true
