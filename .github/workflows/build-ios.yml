name: Build SmartAttend iOS (IPA)

on:
  push:
    branches:
      - main
      - testing-branch
  pull_request:
    branches:
      - main
      - testing-branch
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Build iOS IPA & Simulator App
    runs-on: macos-15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🩹 Patch Swift Package Manager Tools Version
        run: node scripts/patch_spm.js

      - name: 🔨 Build React Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: 🛠️ Select Xcode 16 (Swift 6+)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: 📱 Compile iOS App (Device / BrowserStack IPA)
        run: |
          echo "Building iOS App for Physical Devices & Cloud Testing..."
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          xcodebuild clean build \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          # Create Payload directory and package into SmartAttend.ipa
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/SmartAttend.app
          zip -r SmartAttend.ipa Payload
          echo "✅ SmartAttend.ipa created successfully!"

      - name: 🖥️ Compile iOS Simulator App (for Appetize.io)
        run: |
          echo "Building iOS App for Simulator / Appetize.io..."
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          xcodebuild clean build \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO

          zip -r SmartAttend-Simulator.zip \
            build-sim/Build/Products/Release-iphonesimulator/App.app
          echo "✅ SmartAttend-Simulator.zip created successfully!"

      - name: 📤 Upload SmartAttend.ipa Artifact (BrowserStack & LambdaTest)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttend-IPA
          path: SmartAttend.ipa
          retention-days: 14

      - name: 📤 Upload SmartAttend-Simulator.zip Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttend-Simulator-Appetize
          path: SmartAttend-Simulator.zip
          retention-days: 14