name: Build SmartAttend iOS (IPA)

on:
  push:
    branches:
      - main
      - testing-branch
  pull_request:
    branches:
      - main
      - testing-branch
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Build iOS IPA & Simulator App
    runs-on: macos-15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🩹 Patch Swift Package Manager Tools Version
        run: node scripts/patch_spm.js

      - name: 🔨 Build React Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: 🛠️ Select Xcode with iOS Platform
        run: |
          SELECTED_XCODE=""
          for APP in "/Applications/Xcode_16.1.app" "/Applications/Xcode_16.0.app" "/Applications/Xcode_16.2.app" "/Applications/Xcode.app"; do
            if [ -d "$APP" ]; then
              sudo xcode-select -s "$APP"
              echo "Testing $APP..."
              if xcodebuild -showdestinations -project ios/App/App.xcodeproj -scheme App 2>&1 | grep -q "iOS Simulator"; then
                SELECTED_XCODE="$APP"
                echo "✅ Selected Xcode with iOS Platform: $APP"
                break
              fi
            fi
          done

          if [ -z "$SELECTED_XCODE" ]; then
            echo "⚠️ Downloading iOS platform runtime..."
            sudo xcodebuild -downloadPlatform iOS || true
          fi

          xcode-select -p
          xcodebuild -version

      - name: 📱 Compile iOS App (Xcode Build)
        run: |
          echo "Building iOS App with Xcode..."
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          # Discover valid destination directly from xcodebuild
          DEST_ARG=$(xcodebuild -showdestinations $TARGET_ARG -scheme App 2>/dev/null | grep -i "platform:iOS Simulator" | head -n 1 | sed -E 's/.*id:([^,}]+).*/id=\1/' | xargs)

          if [ -z "$DEST_ARG" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' | xargs)
            if [ -n "$SIM_ID" ]; then
              DEST_ARG="id=$SIM_ID"
            else
              DEST_ARG="generic/platform=iOS Simulator"
            fi
          fi

          echo "Using Destination: $DEST_ARG"

          xcodebuild build \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination "$DEST_ARG" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 1. Package SmartAttend.ipa (for BrowserStack & LambdaTest)
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphonesimulator/App.app Payload/SmartAttend.app
          zip -r SmartAttend.ipa Payload
          echo "✅ SmartAttend.ipa created successfully!"

          # 2. Package SmartAttend-Simulator.zip (for Appetize.io)
          zip -r SmartAttend-Simulator.zip \
            build/Build/Products/Release-iphonesimulator/App.app
          echo "✅ SmartAttend-Simulator.zip created successfully!"

      - name: 📤 Upload SmartAttend.ipa Artifact (BrowserStack & LambdaTest)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttend-IPA
          path: SmartAttend.ipa
          retention-days: 14

      - name: 📤 Upload SmartAttend-Simulator.zip Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttend-Simulator-Appetize
          path: SmartAttend-Simulator.zip
          retention-days: 14