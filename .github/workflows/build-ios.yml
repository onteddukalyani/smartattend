name: Build SmartAttend iOS (IPA)

on:
  push:
    branches:
      - main
      - testing-branch
  pull_request:
    branches:
      - main
      - testing-branch
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Build iOS IPA & Simulator App
    runs-on: macos-15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🩹 Patch Swift Package Manager Tools Version
        run: node scripts/patch_spm.js

      - name: 🔨 Build React Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: 🛠️ Select Xcode 16 (Swift 6+)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: 📱 Compile iOS App (Xcode 16 Build)
        run: |
          echo "Building iOS App with Xcode 16..."
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          # Find available simulator UDID or device name
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' | xargs)
          if [ -n "$SIM_ID" ]; then
            DEST_ARG="id=$SIM_ID"
            echo "Selected Simulator ID: $SIM_ID"
          else
            DEST_ARG="platform=iOS Simulator,name=iPhone 16"
            echo "Fallback to Simulator: iPhone 16"
          fi

          xcodebuild build \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination "$DEST_ARG" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 1. Package SmartAttend.ipa (for BrowserStack & LambdaTest)
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphonesimulator/App.app Payload/SmartAttend.app
          zip -r SmartAttend.ipa Payload
          echo "✅ SmartAttend.ipa created successfully!"

          # 2. Package SmartAttend-Simulator.zip (for Appetize.io)
          zip -r SmartAttend-Simulator.zip \
            build/Build/Products/Release-iphonesimulator/App.app
          echo "✅ SmartAttend-Simulator.zip created successfully!"

      - name: 📤 Upload SmartAttend.ipa Artifact (BrowserStack & LambdaTest)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttend-IPA
          path: SmartAttend.ipa
          retention-days: 14

      - name: 📤 Upload SmartAttend-Simulator.zip Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttend-Simulator-Appetize
          path: SmartAttend-Simulator.zip
          retention-days: 14