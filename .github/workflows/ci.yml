name: SmartAttend CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/audit-flow-preserving

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: Build web app
        run: npm run build
